<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="drum-section-title drum-section-desc" class="kdiagram"><title id="drum-section-title">A nation drum, cut along its axis</title><desc id="drum-section-desc">The top half of a 3 km nation drum: the Keel at the rim, Low, Middle and High decks, the Hollow with its sunline and the flying halls at the Spindle's ends, the hydrogen jacket and water moat, power in at the front axle and heat out at the back.</desc><style>
.k-bg{fill:var(--dg-bg,#f7f8fb)}
