}</style><rect class="k-bg" x="0" y="0" width="1000" height="760" rx="10"/><defs><marker id="ds-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker></defs><text class="k-ttl" x="28.0" y="42.0" text-anchor="start">A nation drum, cut along its axis</text><text class="k-tm" x="28.0" y="64.0" text-anchor="start">Top half; the bottom half mirrors it. 3 km radius, 3.75 km long, ~200 M people. To scale except the jacket and moat.</text><rect class="k-deck2" x="215" y="190.0" width="525.0" height="7.8"/><rect class="k-deck" x="215" y="197.8" width="525.0" height="54.9"/><rect class="k-deck2" x="215" y="252.7" width="525.0" height="105.8"/><rect class="k-deck" x="215" y="358.6" width="525.0" height="41.4"/><line class="k-line" x1="215" y1="196.7" x2="740.0" y2="196.7" stroke-width="1"/><line class="k-line" x1="215" y1="210.7" x2="740.0" y2="210.7" stroke-width="1"/><line class="k-line" x1="215" y1="224.7" x2="740.0" y2="224.7" stroke-width="1"/><line class="k-line" x1="215" y1="238.7" x2="740.0" y2="238.7" stroke-width="1"/><line class="k-line" x1="215" y1="252.7" x2="740.0" y2="252.7" stroke-width="1"/><line class="k-line" x1="215" y1="266.7" x2="740.0" y2="266.7" stroke-width="1"/><line class="k-line" x1="215" y1="280.7" x2="740.0" y2="280.7" stroke-width="1"/><line class="k-line" x1="215" y1="294.7" x2="740.0" y2="294.7" stroke-width="1"/><line class="k-line" x1="215" y1="308.7" x2="740.0" y2="308.7" stroke-width="1"/><line class="k-line" x1="215" y1="322.7" x2="740.0" y2="322.7" stroke-width="1"/><line class="k-line" x1="215" y1="336.7" x2="740.0" y2="336.7" stroke-width="1"/><line class="k-line" x1="215" y1="350.7" x2="740.0" y2="350.7" stroke-width="1"/><line class="k-line" x1="215" y1="364.7" x2="740.0" y2="364.7" stroke-width="1"/><line class="k-line" x1="215" y1="378.7" x2="740.0" y2="378.7" stroke-width="1"/><line class="k-line" x1="215" y1="392.7" x2="740.0" y2="392.7" stroke-width="1"/><line class="k-sink" x1="278.0" y1="197.0" x2="278.0" y2="400.0" stroke-width="2" opacity="0.5"/><line class="k-sink" x1="377.8" y1="197.0" x2="377.8" y2="400.0" stroke-width="2" opacity="0.5"/><line class="k-sink" x1="477.5" y1="197.0" x2="477.5" y2="400.0" stroke-width="2" opacity="0.5"/><line class="k-sink" x1="577.2" y1="197.0" x2="577.2" y2="400.0" stroke-width="2" opacity="0.5"/><line class="k-sink" x1="677.0" y1="197.0" x2="677.0" y2="400.0" stroke-width="2" opacity="0.5"/><rect class="k-sky" x="215" y="400.0" width="525.0" height="210.0"/><rect x="278.0" y="568.0" width="399.0" height="42.0" class="k-acc" opacity="0.13"/><path class="k-deck" d="M215.0,400.0 L220.6,400.0 L220.6,430.8 L224.8,430.8 L224.8,461.6 L229.0,461.6 L229.0,492.4 L233.2,492.4 L233.2,523.2 L237.4,523.2 L237.4,554.0 L241.6,554.0 L241.6,584.8 L215.0,584.8 Z"/><path class="k-deck" d="M740.0,400.0 L734.4,400.0 L734.4,430.8 L730.2,430.8 L730.2,461.6 L726.0,461.6 L726.0,492.4 L721.8,492.4 L721.8,523.2 L717.6,523.2 L717.6,554.0 L713.4,554.0 L713.4,584.8 L740.0,584.8 Z"/><rect x="215.0" y="599.5" width="42.0" height="10.5" class="k-fxray" opacity="0.4"/><rect x="698.0" y="599.5" width="42.0" height="10.5" class="k-fxray" opacity="0.4"/><line x1="215" y1="608.5" x2="740.0" y2="608.5" class="k-sink" stroke-width="1" stroke-dasharray="3 3"/><line x1="278.0" y1="608" x2="677.0" y2="608" class="k-sacc" stroke-width="5" stroke-linecap="round"/><rect class="k-h2" x="203" y="178.0" width="549.0" height="12"/><rect class="k-h2" x="203" y="178.0" width="12" height="432.0"/><rect class="k-h2" x="740.0" y="178.0" width="12" height="432.0"/><rect class="k-water" x="197" y="172.0" width="555.0" height="6"/><rect class="k-water" x="197" y="172.0" width="6" height="438.0"/><rect class="k-sink" x="215" y="190.0" width="525.0" height="420.0" stroke-width="1.5"/><rect class="k-ink" x="239.3" y="165.0" width="6" height="7"/><rect class="k-ink" x="298.1" y="165.0" width="6" height="7"/><rect class="k-ink" x="356.9" y="165.0" width="6" height="7"/><rect class="k-ink" x="415.7" y="165.0" width="6" height="7"/><rect class="k-ink" x="474.5" y="165.0" width="6" height="7"/><rect class="k-ink" x="533.3" y="165.0" width="6" height="7"/><rect class="k-ink" x="592.1" y="165.0" width="6" height="7"/><rect class="k-ink" x="650.9" y="165.0" width="6" height="7"/><rect class="k-ink" x="709.7" y="165.0" width="6" height="7"/><rect class="k-ink" x="179" y="601" width="18" height="9"/><rect class="k-ink" x="752.0" y="601" width="18" height="9"/><path class="k-lead" d="M200.0,178.0 L155.0,112.0"/><circle cx="200.0" cy="178.0" r="2.2" class="k-ink"/><text class="k-th" x="151.0" y="116.0" text-anchor="end">Moat</text><text class="k-t" x="151.0" y="132.0" text-anchor="end">0.5 m of water over the</text><text class="k-t" x="151.0" y="148.0" text-anchor="end">sides and front cap</text><path class="k-lead" d="M418.7,164.0 L355.0,112.0"/><circle cx="418.7" cy="164.0" r="2.2" class="k-ink"/><text class="k-th" x="359.0" y="116.0" text-anchor="start">Quays and station rings</text><text class="k-t" x="359.0" y="132.0" text-anchor="start">nine glide lanes leave from the rim</text><path class="k-lead" d="M746.0,182.0 L780.0,112.0"/><circle cx="746.0" cy="182.0" r="2.2" class="k-ink"/><text class="k-th" x="784.0" y="116.0" text-anchor="start">Hydrogen jacket</text><text class="k-t" x="784.0" y="132.0" text-anchor="start">50 m at 20 K, drawn thick</text><text class="k-th" x="390.0" y="463.0" text-anchor="start">The Hollow</text><text class="k-t" x="390.0" y="479.0" text-anchor="start">park and civic heart, 3 km across;</text><text class="k-t" x="390.0" y="495.0" text-anchor="start">0.5 g floor, weightless at the axis</text><path class="k-lead" d="M593.0,607.0 L572.0,533.0"/><circle cx="593.0" cy="607.0" r="2.2" class="k-ink"/><text class="k-th" x="576.0" y="537.0" text-anchor="start">Sunline</text><text class="k-t" x="576.0" y="553.0" text-anchor="start">stops ~450 m short of each end</text><path class="k-lead" d="M243.0,604.0 L292.0,565.2"/><circle cx="243.0" cy="604.0" r="2.2" class="k-ink"/><text class="k-th" x="296.0" y="569.2" text-anchor="start">Flying halls</text><text class="k-t" x="296.0" y="585.2" text-anchor="start">the Spindle's ends, under 3% g</text><path class="k-lead" d="M677.0,288.0 L635.0,288.0"/><circle cx="677.0" cy="288.0" r="2.2" class="k-ink"/><text class="k-tm" x="631.0" y="292.0" text-anchor="end">Lift core</text><text class="k-th" x="28.0" y="330.0" text-anchor="start">Front</text><text class="k-t" x="28.0" y="346.0" text-anchor="start">faces the Lantern</text><text class="k-t" x="28.0" y="362.0" text-anchor="start">and its X-rays</text><path class="k-sink" stroke-width="1.5" d="M30,393.0 L175,393.0" marker-end="url(#ds-arr)"/><path class="k-sacc" stroke-width="2.5" d="M30,606 L173,606" marker-end="url(#ds-arr)"/><text class="k-th" x="28.0" y="634.0" text-anchor="start">Power in</text><text class="k-t" x="28.0" y="650.0" text-anchor="start">at the front axle,</text><text class="k-t" x="28.0" y="666.0" text-anchor="start">~160 GW of the cell's</text><text class="k-t" x="28.0" y="682.0" text-anchor="start">~340 GW</text><path class="k-swater" stroke-width="2.5" d="M774.0,606 L960,606" marker-end="url(#ds-arr)"/><text class="k-th" x="780.0" y="634.0" text-anchor="start">Heat out</text><text class="k-t" x="780.0" y="650.0" text-anchor="start">at the back axle, as</text><text class="k-t" x="780.0" y="666.0" text-anchor="start">ammonia to the raft's</text><text class="k-t" x="780.0" y="682.0" text-anchor="start">radiator panels</text><path class="k-lead" d="M754.0,193.9 L778.0,196.0"/><text class="k-th" x="786.0" y="200.0" text-anchor="start">The Keel</text><text class="k-tm" x="786.0" y="215.0" text-anchor="start">decks 1–15 · ~1 g · no homes</text><text class="k-tm" x="786.0" y="230.0" text-anchor="start">food plant, water, reserves</text><path class="k-lead" d="M754.0,225.3 L778.0,252.0"/><text class="k-th" x="786.0" y="256.0" text-anchor="start">Low decks</text><text class="k-tm" x="786.0" y="271.0" text-anchor="start">16–113 · 0.98–0.85 g · ~67 M</text><text class="k-tm" x="786.0" y="286.0" text-anchor="start">families, schools, visitors</text><path class="k-lead" d="M754.0,305.6 L778.0,304.2"/><text class="k-th" x="786.0" y="308.2" text-anchor="start">Middle decks</text><text class="k-tm" x="786.0" y="323.2" text-anchor="start">114–301 · 0.85–0.6 g · ~102 M</text><text class="k-tm" x="786.0" y="338.2" text-anchor="start">most homes and work</text><path class="k-lead" d="M754.0,379.3 L778.0,377.0"/><text class="k-th" x="786.0" y="381.0" text-anchor="start">High decks</text><text class="k-tm" x="786.0" y="396.0" text-anchor="start">302–375 · 0.6–0.5 g · ~30 M</text><text class="k-tm" x="786.0" y="411.0" text-anchor="start">elders, prestige flats</text><text class="k-th" x="786.0" y="440.0" text-anchor="start">Out is down</text><text class="k-tm" x="786.0" y="455.0" text-anchor="start">gravity rises toward</text><text class="k-tm" x="786.0" y="470.0" text-anchor="start">the rim; the Hollow is up</text><line class="k-sink" x1="215" y1="730" x2="355" y2="730" stroke-width="2"/><text class="k-tm" x="285.0" y="720.0" text-anchor="middle">1 km</text><text class="k-tm" x="379.0" y="734.0" text-anchor="start">Thin lines: the fifteen line decks that carry the Lattice's tubes. Dark verticals: lift cores.</text></svg>
