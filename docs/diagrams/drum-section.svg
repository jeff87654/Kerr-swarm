.k-faint{fill:var(--dg-faint,#1b2030)}
.k-ink{fill:var(--ink,#e7e9f0)}
.k-sink{stroke:var(--ink,#e7e9f0);fill:none}
.k-acc{fill:var(--accent,#e7b75f)}
