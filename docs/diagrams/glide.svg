<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="glide-title glide-desc" class="kdiagram"><title id="glide-title">The Glide</title><desc id="glide-desc">Top view of six nation drums on a raft, spinning the same way, with the shared tangent lanes along rows and columns; a car let go at one drum's rim coasts 24.5 km to the next in 140 seconds.</desc><style>
.k-bg{fill:var(--dg-bg,#f7f8fb)}
.k-t{fill:var(--ink,#171b27);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:13px}
.k-tm{fill:var(--muted,#596076);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:12px}
.k-th{fill:var(--ink,#171b27);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:14px;font-weight:700}
.k-ttl{fill:var(--ink,#171b27);font-family:var(--font-display,Georgia,serif);font-size:24px}
.k-lead{stroke:var(--muted,#596076);stroke-width:1;fill:none}
.k-line{stroke:var(--line,#c9cdd8);fill:none}
.k-faint{fill:var(--dg-faint,#e6e8ef)}
.k-ink{fill:var(--ink,#171b27)}
.k-sink{stroke:var(--ink,#171b27);fill:none}
.k-acc{fill:var(--accent,#9a6200)}
.k-sacc{stroke:var(--accent,#9a6200);fill:none}
.k-hot{stroke:var(--dg-hot,#f59f00)}
.k-warm{stroke:var(--dg-warm,#e8590c)}
.k-cool{stroke:var(--dg-cool,#b02a1a)}
.k-cold{stroke:var(--dg-cold,#5c2b2b)}
.k-fhot{fill:var(--dg-hot,#f59f00)}
.k-water{fill:var(--dg-water,#1c7ed6)}
.k-swater{stroke:var(--dg-water,#1c7ed6);fill:none}
.k-h2{fill:var(--dg-hydrogen,#99e9f2)}
.k-xray{stroke:var(--dg-xray,#7048e8);fill:none}
.k-fxray{fill:var(--dg-xray,#7048e8)}
.k-sky{fill:var(--dg-sky,#fff4d6)}
.k-deck{fill:var(--dg-deck,#dfe3ec)}
.k-deck2{fill:var(--dg-deck2,#cfd5e2)}
.k-raft{stroke:var(--dg-raft,#3b4256)}
.k-fraft{fill:var(--dg-raft,#3b4256)}
@media (prefers-color-scheme: dark){
.k-bg{fill:var(--dg-bg,#10131c)}
.k-t{fill:var(--ink,#e7e9f0);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:13px}
.k-tm{fill:var(--muted,#9ca3b8);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:12px}
.k-th{fill:var(--ink,#e7e9f0);font-family:var(--font-body,"Atkinson Hyperlegible",system-ui,sans-serif);font-size:14px;font-weight:700}
.k-ttl{fill:var(--ink,#e7e9f0);font-family:var(--font-display,Georgia,serif);font-size:24px}
.k-lead{stroke:var(--muted,#9ca3b8);stroke-width:1;fill:none}
.k-line{stroke:var(--line,#30364a);fill:none}
.k-faint{fill:var(--dg-faint,#1b2030)}
.k-ink{fill:var(--ink,#e7e9f0)}
.k-sink{stroke:var(--ink,#e7e9f0);fill:none}
.k-acc{fill:var(--accent,#e7b75f)}
.k-sacc{stroke:var(--accent,#e7b75f);fill:none}
.k-hot{stroke:var(--dg-hot,#ffd43b)}
.k-warm{stroke:var(--dg-warm,#ff922b)}
.k-cool{stroke:var(--dg-cool,#e03131)}
.k-cold{stroke:var(--dg-cold,#7d3434)}
.k-fhot{fill:var(--dg-hot,#ffd43b)}
.k-water{fill:var(--dg-water,#4dabf7)}
.k-swater{stroke:var(--dg-water,#4dabf7);fill:none}
.k-h2{fill:var(--dg-hydrogen,#0b7285)}
.k-xray{stroke:var(--dg-xray,#9775fa);fill:none}
.k-fxray{fill:var(--dg-xray,#9775fa)}
.k-sky{fill:var(--dg-sky,#3a3013)}
.k-deck{fill:var(--dg-deck,#232a3c)}
.k-deck2{fill:var(--dg-deck2,#2b3349)}
.k-raft{stroke:var(--dg-raft,#aab2c8)}
.k-fraft{fill:var(--dg-raft,#aab2c8)}
}</style><rect class="k-bg" x="0" y="0" width="1000" height="640" rx="10"/><defs><marker id="gl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="gl-arra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-acc"/></marker></defs><text class="k-ttl" x="28.0" y="42.0" text-anchor="start">The Glide</text><text class="k-tm" x="28.0" y="64.0" text-anchor="start">Nation drums on a raft, seen from the Lantern. All spin the same way, so neighbours share tangent lines. To scale.</text><rect class="k-faint" x="32.0" y="102.0" width="196.0" height="196.0"/><line class="k-line" x1="40.0" y1="175.6" x2="612.0" y2="175.6" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="40.0" y1="224.4" x2="612.0" y2="224.4" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="40.0" y1="371.6" x2="612.0" y2="371.6" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="40.0" y1="420.4" x2="612.0" y2="420.4" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="105.6" y1="110.0" x2="105.6" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="154.4" y1="110.0" x2="154.4" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="301.6" y1="110.0" x2="301.6" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="350.4" y1="110.0" x2="350.4" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="497.6" y1="110.0" x2="497.6" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><line class="k-line" x1="546.4" y1="110.0" x2="546.4" y2="486.0" stroke-width="1" stroke-dasharray="5 4"/><circle cx="130.0" cy="200.0" r="25.9" class="k-water"/><circle cx="130.0" cy="200.0" r="24.0" class="k-deck2"/><circle cx="130.0" cy="200.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M107.0,177.0 A32.4,32.4 0 0 1 153.0,177.0" marker-end="url(#gl-arr)"/><circle cx="326.0" cy="200.0" r="25.9" class="k-water"/><circle cx="326.0" cy="200.0" r="24.0" class="k-deck2"/><circle cx="326.0" cy="200.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M303.0,177.0 A32.4,32.4 0 0 1 349.0,177.0" marker-end="url(#gl-arr)"/><circle cx="522.0" cy="200.0" r="25.9" class="k-water"/><circle cx="522.0" cy="200.0" r="24.0" class="k-deck2"/><circle cx="522.0" cy="200.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M499.0,177.0 A32.4,32.4 0 0 1 545.0,177.0" marker-end="url(#gl-arr)"/><circle cx="130.0" cy="396.0" r="25.9" class="k-water"/><circle cx="130.0" cy="396.0" r="24.0" class="k-deck2"/><circle cx="130.0" cy="396.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M107.0,373.0 A32.4,32.4 0 0 1 153.0,373.0" marker-end="url(#gl-arr)"/><circle cx="326.0" cy="396.0" r="25.9" class="k-water"/><circle cx="326.0" cy="396.0" r="24.0" class="k-deck2"/><circle cx="326.0" cy="396.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M303.0,373.0 A32.4,32.4 0 0 1 349.0,373.0" marker-end="url(#gl-arr)"/><circle cx="522.0" cy="396.0" r="25.9" class="k-water"/><circle cx="522.0" cy="396.0" r="24.0" class="k-deck2"/><circle cx="522.0" cy="396.0" r="12.0" class="k-sky"/><path class="k-sink" stroke-width="1.3" d="M499.0,373.0 A32.4,32.4 0 0 1 545.0,373.0" marker-end="url(#gl-arr)"/><line class="k-sacc" x1="130.0" y1="175.6" x2="318.0" y2="175.6" stroke-width="3" marker-end="url(#gl-arra)"/><circle cx="130.0" cy="175.6" r="4.5" class="k-acc"/><circle cx="326.0" cy="175.6" r="4.5" class="k-acc"/><text class="k-t" x="228.0" y="149.6" text-anchor="middle">let go here, caught there:</text><text class="k-th" x="228.0" y="165.6" text-anchor="middle">24.5 km in 140 s at 174 m/s</text><text class="k-tm" x="326.0" y="246.4" text-anchor="middle">bottom lanes run the other way</text><line class="k-sink" x1="546.4" y1="236.4" x2="546.4" y2="357.6" stroke-width="1.5" marker-end="url(#gl-arr)"/><text class="k-tm" x="554.4" y="294.0" text-anchor="start">columns</text><text class="k-tm" x="554.4" y="308.0" text-anchor="start">work the same</text><text class="k-tm" x="40.0" y="276.0" text-anchor="start">one cell:</text><text class="k-tm" x="40.0" y="290.0" text-anchor="start">~600 km²,</text><text class="k-tm" x="40.0" y="304.0" text-anchor="start">~200 M people</text><text class="k-th" x="40.0" y="514.0" text-anchor="start">At the touch point (not to scale)</text><path class="k-sink" stroke-width="2" d="M44.8,584.3 A240,240 0 0 1 255.2,584.3"/><line class="k-line" x1="30" y1="560" x2="300" y2="560" stroke-width="1" stroke-dasharray="5 4"/><rect class="k-acc" x="141" y="552" width="18" height="10" rx="3"/><line class="k-sacc" x1="164" y1="557" x2="240" y2="557" stroke-width="2" marker-end="url(#gl-arra)"/><text class="k-tm" x="120.0" y="594.0" text-anchor="start">the rim curves away under the car at ~1 g</text><text class="k-tm" x="320.0" y="554.0" text-anchor="start">The car keeps the rim's speed and flies straight on.</text><text class="k-tm" x="320.0" y="569.0" text-anchor="start">Gravity switches off in about a second.</text><text class="k-th" x="690.0" y="110.0" text-anchor="start">How a glide works</text><text class="k-t" x="690.0" y="127.0" text-anchor="start">A spinning rim moves along its own tangent.</text><text class="k-t" x="690.0" y="144.0" text-anchor="start">Two drums spinning the same way share their</text><text class="k-t" x="690.0" y="161.0" text-anchor="start">outer tangents, and where a line touches each</text><text class="k-t" x="690.0" y="178.0" text-anchor="start">rim, that rim moves along it at the same speed.</text><text class="k-t" x="690.0" y="195.0" text-anchor="start">So a car let go at one touch point coasts</text><text class="k-t" x="690.0" y="212.0" text-anchor="start">straight to the next and arrives at exactly the</text><text class="k-t" x="690.0" y="229.0" text-anchor="start">speed of the rim it meets. The first drum's</text><text class="k-t" x="690.0" y="246.0" text-anchor="start">spin slows by the car's momentum and the</text><text class="k-t" x="690.0" y="263.0" text-anchor="start">second's speeds up by as much: nothing is lost.</text><text class="k-t" x="690.0" y="280.0" text-anchor="start"></text><text class="k-th" x="690.0" y="297.0" text-anchor="start">At the quay</text><text class="k-t" x="690.0" y="314.0" text-anchor="start">A cradle lets the car go at the touch point.</text><text class="k-t" x="690.0" y="331.0" text-anchor="start">At the far end a cradle takes it on a soft,</text><text class="k-t" x="690.0" y="348.0" text-anchor="start">regenerative arm and brings gravity back.</text><text class="k-t" x="690.0" y="365.0" text-anchor="start">A missed catch isn't a crash: the lane grazes</text><text class="k-t" x="690.0" y="382.0" text-anchor="start">the next drum in the row 140 s later.</text><text class="k-t" x="690.0" y="399.0" text-anchor="start"></text><text class="k-th" x="690.0" y="416.0" text-anchor="start">Reach, door to door</text><text class="k-t" x="690.0" y="433.0" text-anchor="start">~80 drums, 1.6 × 10¹⁰ people, in 20 minutes;</text><text class="k-t" x="690.0" y="450.0" text-anchor="start">~1,100 drums, 2.2 × 10¹¹, in an hour.</text></svg>
