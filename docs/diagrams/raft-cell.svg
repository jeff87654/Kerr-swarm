="M477.5,226.7 L760.0,128.0"/><circle cx="477.5" cy="226.7" r="2.2" class="k-ink"/><text class="k-th" x="764.0" y="132.0" text-anchor="start">Glide lanes</text><text class="k-t" x="764.0" y="148.0" text-anchor="start">nine levels, dashed</text><text class="k-tm" x="40.0" y="406.0" text-anchor="start">Between the layers lies the mid-raft, 3.75 km deep: truss, power lines, glide lanes, tubes, data halls and Yards, all in the X-ray flood.</text></svg>
